<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cookbook Analytics Dashboard (Bokeh v2)</title>
    {{ bokeh_resources|safe }}
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 20px; }
      .filters { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; align-items: end; margin: 16px 0 24px; }
      label { display: block; font-size: 12px; color: #444; margin-bottom: 6px; }
      select, input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 8px; }
      button { padding: 10px 14px; border: 0; border-radius: 10px; cursor: pointer; background: #111; color: #fff; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .card { border: 1px solid #e6e6e6; border-radius: 12px; padding: 12px; }
    </style>
  </head>
  <body>
    <h1>Bokeh Dashboard (v2)</h1>
    <p style="color:#666;margin-top:6px;">Uses the same 6 aggregated queries, rendered as Bokeh charts.</p>

    <form method="get" class="filters">
      <div>
        <label>Category</label>
        <select name="recipe_category_id">
          <option value="">All</option>
          {% for c in categories %}
            <option value="{{ c.id }}" {% if filters.recipe_category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label>Top limit</label>
        <input type="number" min="1" max="100" name="limit" value="{{ limit }}" />
      </div>

      <div>
        <label>Min comments</label>
        <input type="number" min="1" max="100" name="min_comments" value="{{ min_comments }}" />
      </div>

      <div>
        <label>Min ingredients</label>
        <input type="number" min="1" max="50" name="min_items" value="{{ min_items }}" />
      </div>

      <div>
        <label>Min recipes per ingredient</label>
        <input type="number" min="1" max="50" name="min_recipes" value="{{ min_recipes }}" />
      </div>

      <div>
        <label>Months</label>
        <input type="number" min="1" max="48" name="months" value="{{ months }}" />
      </div>

      <div>
        <button type="submit">Apply</button>
      </div>
    </form>

    {% for p in plots %}
      {{ p.script|safe }}
    {% endfor %}

    <div class="grid">
      {% for p in plots %}
        <div class="card">
          {{ p.div|safe }}
        </div>
      {% endfor %}
    </div>
  </body>
</html>
